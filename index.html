<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Drink</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f9f8f6;--surface:#fff;--text:#1a1a1a;--text2:#8c8c8c;
  --border:#e8e4de;--accent:#c4976a;--accent-h:#b08050;
  --radius:10px;--font-body:"Noto Sans JP","Inter",system-ui,-apple-system,sans-serif;--font-head:"Noto Serif JP",serif;
}
body{
  font-family:var(--font-body);background:#ede6d8;color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 20px;-webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:24px;position:relative;z-index:1;}

.title{font-size:1.5rem;font-weight:500;font-family:var(--font-head);letter-spacing:0.06em;text-align:center;color:var(--text);}

.lang-toggle{
  font-size:0.7rem;color:var(--text2);cursor:pointer;border:1px solid var(--border);
  border-radius:999px;padding:3px 12px;background:var(--surface);transition:all 0.2s;
  letter-spacing:0.06em;
}
.lang-toggle:hover{border-color:var(--accent);color:var(--accent);}

.steps{display:flex;gap:6px;align-items:center;}
.steps span{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all 0.3s;}
.steps span.on{background:var(--accent);width:22px;border-radius:999px;}
.steps span.done{background:var(--accent);}

.slot-area{width:100%;display:flex;flex-direction:column;gap:18px;}
.slot-group{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;}
.slot-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.2em;color:var(--text2);}
.slot-frame{
  width:100%;max-width:300px;height:52px;
  border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);
  overflow:hidden;position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,0.03);
}
.slot-list{}
.slot-row{
  height:52px;display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;color:var(--text);padding:0 20px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slot-marker{
  position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
}
.slot-marker.left{left:8px;border-right:7px solid var(--accent);}
.slot-marker.right{right:8px;border-left:7px solid var(--accent);}
.slot-result{font-size:1.2rem;font-weight:500;color:var(--accent);text-align:center;padding:2px 0;}

.btn{
  padding:10px 36px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:0.88rem;cursor:pointer;
  transition:all 0.2s;font-family:var(--font-body);letter-spacing:0.02em;
  box-shadow:0 1px 2px rgba(0,0,0,0.04);
}
.btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.pri:hover{background:var(--accent-h);color:#fff;}
.btn.sm{padding:6px 14px;font-size:0.75rem;}
.btn:disabled{opacity:0.35;cursor:not-allowed;}
.btn.save-btn{background:#8db580;color:#fff;border-color:#8db580;}
.btn.save-btn:hover{background:#7aa370;}
.btn.discard-btn{border-color:#d44;color:#d44;}
.btn.discard-btn:hover{background:#fff5f5;}

.bottom{display:flex;gap:10px;align-items:center;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;font-size:1rem;color:var(--text2);
  box-shadow:0 1px 2px rgba(0,0,0,0.03);outline:none;-webkit-appearance:none;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.2);display:flex;
  align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity 0.25s;backdrop-filter:blur(3px);
}
.overlay.on{opacity:1;pointer-events:auto;}
.modal{
  background:var(--surface);border-radius:14px;padding:24px 20px;
  width:90%;max-width:440px;max-height:80vh;overflow-y:auto;
  box-shadow:0 8px 40px rgba(0,0,0,0.1);display:flex;flex-direction:column;gap:16px;
}
.modal h3{font-size:1.05rem;font-weight:500;font-family:var(--font-head);text-align:center;letter-spacing:0.06em;}
.modal h4{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text2);margin-bottom:4px;}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:999px;border:1px solid var(--border);font-size:0.75rem;font-family:var(--font-body);background:var(--bg);
}
.tag button{border:none;background:none;cursor:pointer;color:var(--text2);padding:0;line-height:1;font-size:0.9rem;}
.tag button:hover{color:#d44;}

.shop-section{
  border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--bg);
}
.shop-section h5{font-size:0.82rem;font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.shop-section h5 .del-shop{
  font-size:0.7rem;color:var(--text2);cursor:pointer;border:none;background:none;
  padding:2px 8px;border-radius:999px;border:1px solid var(--border);
}
.shop-section h5 .del-shop:hover{color:#d44;border-color:#d44;}

.add-row{display:flex;gap:6px;}
.add-row input{
  flex:1;padding:7px 12px;border-radius:999px;border:1px solid var(--border);
  font-size:0.8rem;font-family:var(--font-body);outline:none;background:var(--surface);
}
.add-row input:focus{border-color:var(--accent);}
.act-row{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap;}

/* Card */
.card-area{width:100%;display:flex;justify-content:center;align-items:center;perspective:800px;}
.card-wrap{
  --w:180px;--h:320px;--ps:12px;--ca:70px;
  position:relative;display:grid;
  transform-style:preserve-3d;will-change:transform;
  animation:float 3s ease infinite;grid-template-rows:auto 1fr auto;gap:0.8rem;
  grid-template-areas:"hdr" "bdy" "ftr";
  width:var(--w);height:var(--h);padding:var(--ps) 0;
  font-family:"Inter",sans-serif;font-size:1rem;user-select:none;overflow:hidden;
  filter:drop-shadow(0 2px 1px #0002)drop-shadow(0 4px 3px #0002)drop-shadow(0 10px 9px #0002);
  }

@keyframes float{
  50%{filter:drop-shadow(0 4px 3px #0001)drop-shadow(0 6px 6px #0001)drop-shadow(0 16px 14px #0001);transform:translateY(-7px)scale(1.02);}
}
.card-wrap.sml{
  --w:120px;--h:213px;--ps:8px;--ca:47px;font-size:0.65rem;gap:0.4rem;animation:none;
}
.card-bg{
  position:absolute;inset:0;border-radius:inherit;background-color:#fff;filter:url(#bump);
  mask:radial-gradient(circle at 50% 0,#fff0 calc(var(--ps) - 5px),#000 calc(var(--ps) - 4px)),radial-gradient(circle at 50% 100%,#fff0 calc(var(--ps) - 5px),#000 calc(var(--ps) - 4px)),radial-gradient(circle 8px at left center,#000 98%,#0000 100%),radial-gradient(circle 8px at right center,#000 98%,#0000 100%),repeating-linear-gradient(90deg,#000 10px,#000 15px,#0000 16px,#0000 24px);
  mask-repeat:repeat-x,repeat-x,no-repeat,no-repeat,repeat-x;
  mask-size:calc(var(--ps)*2)100%,calc(var(--ps)*2)100%,16px 16px,16px 16px,10px 2px;
  mask-position:calc(0.5*var(--ps))top,calc(0.5*var(--ps))bottom,left var(--ca),right var(--ca),0 calc(var(--ca) + 7px);
  mask-composite:intersect,exclude,add,add;
}
.card-holo{
  background-image:linear-gradient(to bottom,#fe58,90%,#0002),conic-gradient(at 60% 50%,#ccc,#ff6bfe,#00f9f8,#ddd,#0081fd,#eef0bc,#0081fd,#ff6bfe,#0002,#0081fd,#ddd,#01fefb,#ccc);
}
.card-holo::before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 70% 20%,#f0f,#0000),repeating-radial-gradient(circle at 30% 80%,#fff,#f4a 48px,#eee 150px);
  mix-blend-mode:color-burn;
}
.card-holo::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(to bottom,#f205,#f00,#0f0,#f205);
  mix-blend-mode:difference;animation:holo 3s ease-in-out infinite alternate;
  background-position:0 0;background-size:100% 300%;background-repeat:repeat;
}
@keyframes holo{to{background-position:0 500px;}}
.card-hdr{
  position:relative;grid-area:hdr;margin:0 8px;text-align:center;z-index:1;
  font-family:"Impact",sans-serif;font-size:1.5rem;letter-spacing:1px;
  color:#ffffff9f;text-shadow:0 0 0 #000;-webkit-text-stroke:#fff 0.5px;
  mix-blend-mode:difference;line-height:1.1;
}
.card-wrap.sml .card-hdr{font-size:1rem;}
.card-bdy{grid-area:bdy;margin:0 1em;padding:0.5em;font-weight:300;font-family:var(--font-head);z-index:1;}
.card-bdy .spacer{display:block;height:0.8em;}
.card-ftr{grid-area:ftr;z-index:1;margin:0 1em 1em 1em;}
.card-no{margin-bottom:0.75rem;text-align:center;border-radius:999px 0;color:#000;font-weight:300;font-family:var(--font-head);}
.card-no b{font-weight:600;}
.card-bar{
  justify-self:center;width:0;height:32px;
  box-shadow:0 0 0 1px #000,5px 0 0 1px #000,7px 0 0 1px #000,11px 0 0 1px #000,15px 0 0 1px #000,16px 0 0 1px #000,22px 0 0 1px #000,27px 0 0 1px #000,30px 0 0 1px #000,35px 0 0 1px #000,36px 0 0 1px #000,39px 0 0 1px #000,43px 0 0 1px #000,47px 0 0 1px #000,50px 0 0 1px #000,55px 0 0 1px #000,59px 0 0 1px #000,60px 0 0 1px #000,64px 0 0 1px #000,69px 0 0 1px #000,70px 0 0 1px #000,74px 0 0 1px #000;
  transform:translateX(37px);
}
.card-wrap.sml .card-bar{height:22px;transform:translateX(25px);}
.card-cut{position:absolute;top:1.1em;right:0;rotate:185deg;font-size:1.1em;color:#fff;line-height:0.5;opacity:0.2;}
.card-watermark{
  position:absolute;inset:0;overflow:hidden;font-size:3.4rem;color:#e7e7e7;
  mix-blend-mode:color-burn;z-index:1;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;padding-top:28px;
  line-height:0.85;text-align:center;
}
.card-wrap.sml .card-watermark{font-size:2.2rem;padding-top:18px;}

.hist-card-wrap{position:relative;}
.hist-del{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:0.7rem;
  color:var(--text2);z-index:5;transition:all 0.15s;padding:0;
}
.hist-del:hover{color:#d44;border-color:#d44;background:#fff5f5;}

@keyframes pop{0%{transform:scale(0.3)rotate(-5deg);opacity:0}100%{transform:scale(1)rotate(0deg);opacity:1}}
.pop{animation:pop 0.6s cubic-bezier(0.175,0.885,0.32,1.275)both;}
.hide{display:none!important;}
.in{animation:in 0.4s ease both;}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

.hist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;padding:6px 2px;}
.hist-card{cursor:pointer;transition:transform 0.2s;}
.hist-card:hover{transform:scale(1.05);}

#previewCard{perspective:800px;display:flex;justify-content:center;align-items:center;}
#previewCard .card-wrap{animation:none;}
@media(max-width:480px){
  body{padding:24px 16px;}
  .app{gap:20px;}
  .title{font-size:1.3rem;}
  .slot-frame{max-width:260px;height:48px;}
  .slot-row{height:48px;font-size:0.95rem;}
  .slot-label{font-size:0.6rem;}
  .card-wrap{--w:150px;--h:266px;--ps:10px;--ca:58px;font-size:0.85rem;gap:0.6rem;}
  .card-wrap .card-hdr{font-size:1.2rem;}
  .card-wrap .card-watermark{font-size:2.4rem;padding-top:22px;}
  .card-wrap.sml{--w:100px;--h:178px;--ps:6px;--ca:39px;font-size:0.55rem;gap:0.3rem;}
  .card-wrap.sml .card-hdr{font-size:0.85rem;}
  .card-wrap.sml .card-watermark{font-size:1.8rem;padding-top:14px;}
  .card-wrap.sml .card-bar{height:18px;transform:translateX(20px);}
  .btn{padding:8px 28px;font-size:0.8rem;}
  .btn.sm{padding:5px 12px;font-size:0.7rem;}
  .modal{width:95%;padding:18px 14px;gap:12px;}
  .modal h3{font-size:0.95rem;}
  .hist-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;}
  .bottom{gap:8px;}
  .icon-btn{width:34px;height:34px;font-size:0.9rem;}
  .tag{font-size:0.7rem;padding:2px 8px;}
  .add-row input{font-size:0.72rem;padding:6px 10px;}
  .shop-section h5{font-size:0.75rem;}
  .lang-toggle{font-size:0.65rem;padding:2px 10px;}
}

@media(max-width:360px){
  body{padding:16px 10px;}
  .app{gap:14px;}
  .title{font-size:1.15rem;}
  .slot-frame{max-width:220px;height:44px;}
  .slot-row{height:44px;font-size:0.85rem;}
  .card-wrap{--w:130px;--h:230px;--ps:8px;--ca:50px;font-size:0.75rem;gap:0.4rem;}
  .card-wrap .card-hdr{font-size:1rem;}
  .card-wrap .card-watermark{font-size:2rem;padding-top:18px;}
  .card-wrap.sml{--w:85px;--h:151px;--ps:5px;--ca:33px;font-size:0.5rem;gap:0.2rem;}
  .card-wrap.sml .card-hdr{font-size:0.7rem;}
  .card-wrap.sml .card-watermark{font-size:1.5rem;padding-top:10px;}
  .card-wrap.sml .card-bar{height:14px;transform:translateX(16px);}
  .btn{padding:7px 22px;font-size:0.75rem;}
  .hist-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:10px;}
  .modal{width:98%;padding:14px 10px;}
}
</style>

<body>
<div style="position:fixed;inset:0;z-index:0;pointer-events:none;filter:url(#washi);background:transparent;" aria-hidden="true"></div>

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><filter id="washi"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.90  0 0 0 0 0.88  0 0 0 0.07 0" in="noise" result="colored"></feColorMatrix><feComposite operator="in" in="colored" in2="SourceGraphic"></feComposite></filter><filter id="bump"><feTurbulence result="noise" numOctaves="3" baseFrequency="0.7" type="fractalNoise"></feTurbulence><feSpecularLighting in="noise" result="specular" lighting-color="#fffffc" specularExponent="25" specularConstant="0.8" surfaceScale="0.15"><fePointLight z="210" y="100" x="100"></fePointLight></feSpecularLighting><feComposite result="noise2" operator="in" in="specular" in2="SourceGraphic"></feComposite><feBlend mode="screen" in2="noise2" in="SourceGraphic"></feBlend></filter></svg>

<div class="app" id="app">
  <div class="title">
    <span id="titleMain">What's Drink</span>
  </div>

  <button class="lang-toggle" id="langToggle" title="Switch language">EN / 中</button>

  <div class="steps" id="stepDots"><span id="d1"></span><span id="d2"></span></div>

  <div class="slot-area" id="slotArea">
    <div class="slot-group hide" id="shopGroup">
      <div class="slot-label" id="shopLabel">Shop</div>
      <div class="slot-frame" id="shopFrame"><div class="slot-list" id="shopList"></div><div class="slot-marker left"></div><div class="slot-marker right"></div></div>
      <div class="slot-result hide" id="shopRes"></div>
    </div>
    <div class="slot-group hide" id="drinkGroup">
      <div class="slot-label" id="drinkLabel">Drink</div>
      <div class="slot-frame" id="drinkFrame"><div class="slot-list" id="drinkList"></div><div class="slot-marker left"></div><div class="slot-marker right"></div></div>
      <div class="slot-result hide" id="drinkRes"></div>
    </div>
  </div>

  <div class="card-area hide" id="cardArea"></div>

  <div id="btnWrap"><button class="btn pri" id="btnRoll">Roll</button></div>

  <div class="bottom">
    <button class="icon-btn" id="btnSet" title="Settings">&#9881;</button>
    <button class="icon-btn" id="btnHist" title="History">&#9776;</button>
    <button class="btn sm hide" id="btnAgain">Again</button>
    <button class="btn sm save-btn hide" id="btnSave" class="save-btn">Save</button>
    <button class="btn sm discard-btn hide" id="btnDiscard">Discard</button>
  </div>
</div>

<!-- Settings Overlay -->
<div class="overlay" id="setOv">
  <div class="modal" id="setModal">
    <h3 id="setTitle">Settings</h3>
    <div id="setContent"></div>
    <div class="act-row">
      <button class="btn sm" id="btnAddShop2">+ Add Shop</button>
      <button class="btn sm" id="btnReset">Reset Defaults</button>
      <button class="btn sm" id="btnResetCount">Reset Counter</button>
      <button class="btn sm" id="btnClearHist">Clear History</button>
    </div>
  </div>
</div>

<!-- History Overlay -->
<div class="overlay" id="histOv">
  <div class="modal">
    <h3 id="histTitle">History</h3>
    <div class="hist-grid" id="histGrid"></div>
    <p style="text-align:center;color:var(--text2);font-size:0.8rem;margin-top:10px;" id="histEmpty">No records yet</p>
  </div>
</div>

<!-- Card Preview Overlay -->
<div class="overlay" id="previewOv">
  <div class="modal" style="background:transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;">
    <div id="previewCard"></div>
  </div>
</div>

<script>
// ====== i18n ======
var LANG = (function(){
  try { return localStorage.wd_lang || 'en'; } catch(e) { return 'en'; }
})();

var T = {
  en: {
    title: "What's Drink", sub: "Today's Picks", shopLabel: "Shop", drinkLabel: "Drink",
    btnRoll: "Roll", btnAgain: "Again", setTitle: "Settings", histTitle: "History",
    reset: "Reset Defaults", clearHist: "Clear History", resetCount: "Reset Counter", addShop: "+ Add Shop",
    delShop: "Remove Shop", drinkPlaceholder: "Add drink...",
    histEmpty: "No records yet", cardHeader: "DRINK",
    surprise: "Surprise Me",
    saveCard: "Save", discardCard: "Discard"
  },
  zh: {
    title: "今天喝什么", sub: "今日之选",
    shopLabel: "店铺", drinkLabel: "饮品",
    btnRoll: "开始摇", btnAgain: "再抽一次",
    setTitle: "设置", histTitle: "历史记录",
    reset: "恢复默认", clearHist: "清空历史", resetCount: "重置计数器",
    addShop: "+ 添加店铺", delShop: "删除店铺",
    drinkPlaceholder: "添加饮品...",
    histEmpty: "还没有抽签记录",
    cardHeader: "DRINK",
    surprise: "随心",
    saveCard: "收藏", discardCard: "丢弃"
  }
};

function t(key){ return (T[LANG] && T[LANG][key]) || (T['en'][key] || key); }

function applyLang(){
  document.title = t('title');
  document.getElementById('titleMain').textContent = t('title');
  document.getElementById('shopLabel').textContent = t('shopLabel');
  document.getElementById('drinkLabel').textContent = t('drinkLabel');
  document.getElementById('btnRoll').textContent = t('btnRoll');
  document.getElementById('btnAgain').textContent = t('btnAgain');
  document.getElementById('setTitle').textContent = t('setTitle');
  document.getElementById('histTitle').textContent = t('histTitle');
  document.getElementById('btnReset').textContent = t('reset');
  document.getElementById('btnClearHist').textContent = t('clearHist');
  document.getElementById('btnResetCount').textContent = t('resetCount');
  document.getElementById('btnSave').textContent = t('saveCard');
  document.getElementById('btnDiscard').textContent = t('discardCard');
  document.getElementById('btnAddShop2').textContent = t('addShop');
  document.getElementById('histEmpty').textContent = t('histEmpty');
  document.getElementById('langToggle').textContent = LANG === 'zh' ? 'EN / 中' : 'EN / 中';
  if (document.getElementById('setOv').classList.contains('on')) renderSettings();
  buildShopList();
  if (shopPick && drinkPick && !E.cardArea.classList.contains('hide')) {
    renderCard();
  }
}

// ====== Surprise: all drinks across all menus ======
function allDrinks(){
  var all = [];
  SHOPS.forEach(function(s){
    var drinks = MENU[s] || [];
    for (var i=0;i<drinks.length;i++){
      var name = drinkName(drinks[i]);
      if (all.indexOf(name) < 0) all.push(name);
    }
  });
  return all;
}

// ====== Build slot strips ======
function buildShopList(){
  E.shopList.innerHTML = '';
  var arr = []; for (var i=0;i<7;i++) arr.push.apply(arr, SHOPS);
  arr.forEach(function(n){
    var d = document.createElement('div'); d.className = 'slot-row'; d.textContent = shopName(n);
    E.shopList.appendChild(d);
  });
}

  E.drinkList.innerHTML = '';

  arr.forEach(function(n){

function dots(s){

}

// ====== Spin animation ======
function spin(listEl, items, onDone){
  var H = 52; var N = items.length;
  if (N === 0) { onDone(-1); return; }
  var COPIES = 7, total = N * COPIES;
  var start = N + Math.floor(Math.random() * N);
  listEl.style.transition = 'none';
  listEl.style.transform = 'translateY(-' + (start * H) + 'px)';
  listEl.offsetHeight;
  var cycles = 3 + Math.floor(Math.random() * 3);
  var end = start + cycles * N + Math.floor(Math.random() * N);
  if (end >= total) end = total - 1;
  var dur = 1500 + cycles * 250;
  listEl.style.transition = 'transform ' + dur + 'ms cubic-bezier(0.12,0.8,0.2,1)';
  listEl.style.transform = 'translateY(-' + (end * H) + 'px)';
  setTimeout(function(){ onDone(end % N); }, dur + 150);
}

// ====== Roll flow ======
var shopPick = null, drinkPick = null;
var rollId = 0;

function startRoll(){
  rollId++;
  var myId = rollId;
  E.btnRoll.classList.add('hide');
  E.cardArea.classList.add('hide'); E.cardArea.innerHTML = '';
  // result labels hidden
  E.drinkGroup.classList.add('hide');
  E.shopGroup.classList.remove('hide'); E.shopGroup.classList.add('in');
  E.btnAgain.classList.add('hide');
  shopPick = drinkPick = null;
  dots(1);

  buildShopList();
  spin(E.shopList, SHOPS, function(idx){
    if (myId !== rollId) return;
    shopPick = SHOPS[idx];
    // shop result hidden

    buildDrinkList(shopPick);
    var drinkNames = [t('surprise')];
    var menuDrinks = MENU[shopPick] || [];
    for (var i=0;i<menuDrinks.length;i++){ drinkNames.push(drinkName(menuDrinks[i])); }

    setTimeout(function(){
      if (myId !== rollId) return;
      E.drinkGroup.classList.remove('hide'); E.drinkGroup.classList.add('in');
      dots(2);

      spin(E.drinkList, drinkNames, function(di){
        if (myId !== rollId) return;
        if (di < 0) return;
        if (di === 0) {
          // "Surprise Me" - pick random from ALL drinks
          var allD = [];
          SHOPS.forEach(function(s){
            var ds = MENU[s] || [];
            for (var j=0;j<ds.length;j++) allD.push(ds[j]);
          });
          drinkPick = allD[Math.floor(Math.random() * allD.length)];
        } else {
          drinkPick = MENU[shopPick][di - 1];
        }
        // drink result hidden
        setTimeout(function(){ if (myId === rollId) showCard(); }, 400);
      });
    }, 500);
  });
}

// ====== Card ======
// Temp card data before save/ discard
var pendingCard = null;

function showCard(){
  data.count++;
  var no = String(data.count).padStart(4, '0');
  var d = new Date();
  var ms = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ds = ms[d.getMonth()] + ' ' + d.getDate() + '<sup>' + nth(d.getDate()) + '</sup> ' + d.getFullYear();

  // Store pending card data
  pendingCard = { id:no, shop:shopPick, drink:drinkPick, date:ds, fd:d.toISOString().slice(0,10), ts:Date.now() };

  renderCard(no, ds);
  // Show Save/ Discard buttons
  E.btnSave.classList.remove('hide');
  E.btnDiscard.classList.remove('hide');
  E.btnAgain.classList.add('hide');
}

function saveCard(){
  if (!pendingCard) return;
  data.history.unshift(pendingCard);
  saveData();
  if (data.history.length > 50) data.history.length = 50;
  pendingCard = null;
  E.btnSave.classList.add('hide');
  E.btnDiscard.classList.add('hide');
  E.btnAgain.classList.remove('hide');
  E.btnAgain.classList.add('in');
}

function discardCard(){
  if (!pendingCard) return;
  data.count--;
  pendingCard = null;
  saveData();
  E.btnSave.classList.add('hide');
  E.btnDiscard.classList.add('hide');
  E.cardArea.classList.add('hide');
  E.cardArea.innerHTML = '';
  E.btnRoll.classList.remove('hide');
  shopPick = drinkPick = null;
  dots(0);
}

function renderCard(no, ds){
  if (!no) {
    // Re-render existing card from last roll
    no = data.history.length > 0 ? data.history[0].id : '0001';
    ds = data.history.length > 0 ? data.history[0].date : '';
  }
  var h = '';
  h += '<div class="card-wrap pop">';
  h += '<div class="card-watermark">' + esc(shopName(shopPick)) + '<br>' + esc(drinkName(drinkPick)) + '</div>';
  h += '<div class="card-hdr">' + esc(t('cardHeader')) + '<div class="card-cut">&#9985;</div></div>';
  h += '<div class="card-bdy"><span class="spacer"></span>' + ds + '<br>' + esc(shopName(shopPick)) + '<br>' + esc(drinkName(drinkPick)) + '</div>';
  h += '<div class="card-ftr"><div class="card-no">No. <b>' + no + '</b></div><div class="card-bar"></div></div>';
  h += '<div class="card-bg card-holo"></div>';
  h += '</div>';

  E.cardArea.innerHTML = h;
  E.cardArea.classList.remove('hide'); E.cardArea.classList.add('in');
  E.btnAgain.classList.remove('hide'); E.btnAgain.classList.add('in');
  dots(0);
  // Attach parallax
  setTimeout(attachParallax, 650);
}

function removeShop(si){

  var name = SHOPS[si]; SHOPS.splice(si, 1); delete MENU[name]; delete SHOP_NAMES[name];

function removeDrink(si, di){
  var shop = SHOPS[si];
  if (MENU[shop].length <= 1) return;
  MENU[shop].splice(di, 1);
  buildDrinkList(shop); saveData(); renderSettings();
}

function addDrinkToShop(si){
  var shop = SHOPS[si];
  var inp = E.setContent.querySelector('.drink-in[data-si="' + si + '"]');
  if (!inp) return; var v = inp.value.trim(); inp.value = '';
  if (!v) return;
  var parts = v.split('/');
  var en = parts[0].trim();
  var zh = parts.length > 1 ? parts[1].trim() : en;
  if (!en && !zh) return;
  if (!en) en = zh;
  if (!zh) zh = en;
  // Check duplicate
  var drinks = MENU[shop] || [];
  var checkName = (LANG==='zh'?zh:en);
  for (var i=0;i<drinks.length;i++){
    if (drinkName(drinks[i]) === checkName) return;
  }
  MENU[shop].push({en:en, zh:zh});
  buildDrinkList(shop); saveData(); renderSettings();
}

  var name = prompt(LANG==='zh' ? '\u65b0\u5e97\u94fa\u540d\u79f0:' : 'New shop name:');
  if (!name || !name.trim()) return; name = name.trim();
  if (SHOPS.indexOf(name) >= 0) return;
  SHOPS.push(name); MENU[name] = [{en:'Americano',zh:'美式'},{en:'Latte',zh:'拿铁'}]; SHOP_NAMES[name] = {en:name, zh:name};

}

function clearHistory(){ data.history = []; data.count = 0; saveData(); renderSettings(); }
function openPreview(index){
  var r = data.history[index];
  if (!r) return;
  var h = '';
  h += '<div class="card-wrap">';
  h += '<div class="card-watermark">' + esc(shopName(r.shop)) + '<br>' + esc(drinkName(r.drink)) + '</div>';
  h += '<div class="card-hdr">' + esc(t('cardHeader')) + '<div class="card-cut">&#9985;</div></div>';
  h += '<div class="card-bdy"><span class="spacer"></span>' + r.date + '<br>' + esc(shopName(r.shop)) + '<br>' + esc(drinkName(r.drink)) + '</div>';
  h += '<div class="card-ftr"><div class="card-no">No. <b>' + r.id + '</b></div><div class="card-bar"></div></div>';
  h += '<div class="card-bg card-holo"></div>';
  h += '</div>';
  E.previewCard.innerHTML = h;
  E.previewOv.classList.add('on');

  // Attach parallax to preview card
  var card = E.previewCard.querySelector('.card-wrap');
  if (card) {
    card.style.animationPlayState = 'paused';
    function ptilt(cx, cy){
      var rect = card.getBoundingClientRect();
      var x = (cx - rect.left) / rect.width - 0.5;
      var y = (cy - rect.top) / rect.height - 0.5;
      card.style.transition = 'none';
      card.style.transform = 'perspective(800px) rotateY(' + (x * 18) + 'deg) rotateX(' + (-y * 14) + 'deg)';
    }
    function preset(){
      card.style.transition = 'transform 0.3s ease-out';
      card.style.transform = '';
    }
    card.addEventListener('mousemove', function(e){ ptilt(e.clientX, e.clientY); });
    card.addEventListener('mouseleave', preset);
    card.addEventListener('touchstart', function(e){ e.preventDefault(); var t = e.touches[0]; ptilt(t.clientX, t.clientY); }, {passive: false});
    card.addEventListener('touchmove', function(e){ e.preventDefault(); var t = e.touches[0]; ptilt(t.clientX, t.clientY); }, {passive: false});
    card.addEventListener('touchend', preset);
    card.addEventListener('touchcancel', preset);
  }
}

function closePreview(){
  E.previewOv.classList.remove('on');
  E.previewCard.innerHTML = '';
}

  });
}

// ====== Card parallax ======
function attachParallax(){
  var card = document.querySelector('.card-wrap');
  if (!card) return;
  card.classList.remove('pop');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';

  function tilt(cx, cy){
    var rect = card.getBoundingClientRect();
    var x = (cx - rect.left) / rect.width - 0.5;
    var y = (cy - rect.top) / rect.height - 0.5;
    card.style.transition = 'none';
    card.style.transform = 'perspective(800px) rotateY(' + (x * 18) + 'deg) rotateX(' + (-y * 14) + 'deg)';
  }
  function reset(){
    card.style.transition = 'transform 0.3s ease-out';
    card.style.transform = '';
    card.style.animationPlayState = 'running';
  }

  // Mouse (desktop)
  card.addEventListener('mouseenter', function(){ card.style.animationPlayState = 'paused'; });
  card.addEventListener('mousemove', function(e){ tilt(e.clientX, e.clientY); });
  card.addEventListener('mouseleave', reset);

  // Touch drag (mobile)
  card.addEventListener('touchstart', function(e){
    e.preventDefault();
    card.style.animationPlayState = 'paused';
    var t = e.touches[0];
    tilt(t.clientX, t.clientY);
  }, {passive: false});
  card.addEventListener('touchmove', function(e){
    e.preventDefault();
    var t = e.touches[0];
    tilt(t.clientX, t.clientY);
  }, {passive: false});
  card.addEventListener('touchend', reset);
  card.addEventListener('touchcancel', reset);
}
